:root {

[data-theme="dark"] {

  --c-light: rgba(54, 179, 179, 0.06);
  --c-alpha: rgba(54, 179, 179, 0.08);
  --btn-hover: rgba(54, 179, 179, 0.1);
  --btn-active: #36B3B3;
  --btn-active-text: #fff;
}
html {
  height: 100%;
  scroll-behavior: smooth;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
  transition: background 0.3s, color 0.3s;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulseSoft {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}
@keyframes btnPress {
  0% { transform: scale(1); }
  50% { transform: scale(0.96); }
  100% { transform: scale(1); }
}
.main-wrapper {
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 80px 20px;
  gap: 12px;
}
.cube-wrapper {
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
  animation: fadeInUp 0.5s backwards;
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--c);
  box-shadow: 0 6px 20px rgba(54,179,179,0.08);
}
.block-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px;
  color: inherit;
  transition: background-color var(--transition);
}
.block-content:hover {
  background: var(--c-light);
}
.block-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
}
.block-title.muted {
  color: var(--subtext);
  font-weight: 400;
}
.block-title-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
}
.block-actions-wrapper {
  display: flex;
  align-items: center;
  gap: 14px;
}
.icon {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  transition: transform var(--transition);
}
.icon:hover {
  transform: scale(1.12);
}
.os-icon {
  width: 18px;
  height: 18px;
}
.os-tag {
  padding: 3px 9px;
  border-radius: 9px;
  font-size: 12px;
  background: var(--c);
  color: #fff;
  font-weight: 500;
}
.bar {
  position: fixed;
  z-index: 999;
  display: flex;
  gap: 8px;
}
.lang-bar {
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
}
.header-icons {
  top: 16px;
  right: 16px;
}
.footer-bar {
  bottom: 16px;
  left: 16px;
}
.visit-counter {
  position: fixed;
  bottom: 16px;
  right: 16px;
  font-size: 12px;
  color: var(--subtext);
}
.btn {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 9px 15px;
  font-size: 14px;
  font-weight: 500;
  transition: all var(--transition);
  cursor: pointer;
}
.btn:hover {
  background: var(--btn-hover);
  border-color: var(--c);
  transform: translateY(-1px);
}
.btn:active {
  animation: btnPress 0.25s ease;
}
.btn.active {
  background: var(--btn-active);
  color: var(--btn-active-text);
  border-color: var(--c);
}
.dynamic-text {
  text-align: center;
  padding: 12px 0;
  font-size: 14px;
  color: var(--subtext);
  transition: opacity 0.4s;
}
#toTop {
  position: fixed;
  bottom: 65px;
  right: 20px;
  width: 42px;
  height: 42px;
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 16px;
  opacity: 0;
  transition: all var(--transition);
}
#toTop.show {
  opacity: 1;
}
#toTop:hover {
  background: var(--c-light);
  border-color: var(--c);
  transform: scale(1.08);
}
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 99999;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s;
  padding: 20px;
}
.modal-overlay.show {
  opacity: 1;
}
.modal-box {
  background: var(--card);
  color: var(--text);
  width: 100%;
  max-width: 680px;
  padding: 26px;
  border-radius: var(--radius);
  max-height: 80vh;
  overflow-y: auto;
  transform: translateY(20px);
  transition: transform 0.3s;
}
.modal-overlay.show .modal-box {
  transform: translateY(0);
}
.modal-close {
  position: absolute;
  top: 18px;
  right: 18px;
  font-size: 20px;
  cursor: pointer;
  color: var(--subtext);
}
.modal-title {

  margin-bottom: 16px;
  text-align: center;
}
.agreement-text {

}
.toast {

  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.toast.show {
  opacity: 1;
}

/* Android 16 / Material 3 Expressive Motion Layer */
:root{
  --motion-standard: cubic-bezier(.2,.0,0,1);
  --motion-emphasized: cubic-bezier(.05,.7,.1,1);
}

body{
  animation: androidPageEnter .55s var(--motion-emphasized) both;
}

@keyframes androidPageEnter{
  from{opacity:0; transform:translateY(18px) scale(.985); filter:blur(8px)}
  to{opacity:1; transform:none; filter:blur(0)}
}

.card{
  transform-origin:center;
  transition:
    transform .45s var(--motion-emphasized),
    box-shadow .45s var(--motion-emphasized),
    border-color .35s ease,
    background .35s ease;
}

.card:hover{
  transform:translateY(-6px) scale(1.012);
}

.card:active{
  transform:scale(.97);
  transition:.12s cubic-bezier(.3,0,.8,.15);
}

.btn,.block-content,#toTop{
  position:relative;
  overflow:hidden;
}

.btn::after,.block-content::after,#toTop::after{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  border-radius:50%;
  background:currentColor;
  opacity:0;
  transform:scale(0);
  pointer-events:none;
}

.btn:active::after,.block-content:active::after,#toTop:active::after{
  animation:m3Ripple .55s var(--motion-standard);
}

@keyframes m3Ripple{
  0%{opacity:.18;transform:scale(0)}
  100%{opacity:0;transform:scale(16)}
}

.modal-overlay{
  backdrop-filter:blur(18px) saturate(130%);
}

.modal-box{
  animation:m3Dialog .4s var(--motion-emphasized) both;
  box-shadow:0 24px 80px rgba(0,0,0,.22);
}

@keyframes m3Dialog{
  from{opacity:0;transform:translateY(40px) scale(.92)}
  to{opacity:1;transform:none}
}

.os-tag,.active{
  transition:.35s var(--motion-emphasized);
}

.dynamic-text{
  animation:m3TextFade .5s ease;
}

@keyframes m3TextFade{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

@media(prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
}

let currentLang = localStorage.getItem('lang') || 'zh';
let textIndex = 0, textTimer;
const root = document.documentElement;
const textBox = document.getElementById('textBox');
const visitEl = document.getElementById('visit');
const toast = document.getElementById('toast');
const toTop = document.getElementById('toTop');
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1300);
}
function updateText() {
  const arr = i18n[currentLang].texts;
  textBox.style.opacity = 0;
  setTimeout(() => {
    textBox.textContent = arr[textIndex % arr.length];
    textBox.style.opacity = 1;
    textIndex++;
  }, 200);
}
function restartText() {
  clearInterval(textTimer);
  textIndex = 0;
  updateText();
  textTimer = setInterval(updateText, 3600);
}
// 访问量：只首次进入+1，刷新不重复+1
function addVisit() {
  let hasCount = sessionStorage.getItem('hasCount');
  if(hasCount) return;
  let cnt = localStorage.getItem('visit') || 0;
  cnt++;
  localStorage.setItem('visit', cnt);
  sessionStorage.setItem('hasCount','1');
}
function renderLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.style.opacity = '0';
    setTimeout(() => {
      const k = el.dataset.i18n;
      if (i18n[currentLang][k]) el.textContent = i18n[currentLang][k];
      el.style.opacity = '1';
    }, 150);
  });
  document.title = i18n[currentLang].title;
  restartText();
  document.getElementById('agreementContent').textContent = i18n[currentLang].agreement_content;
  document.getElementById('userContent').textContent = i18n[currentLang].userContent;
  document.getElementById('privacyContent').textContent = i18n[currentLang].privacyContent;
}
function openModal(m) {
  m.style.display = 'flex';
  setTimeout(() => m.classList.add('show'), 10);
}
function closeModal(m) {
  m.classList.remove('show');
  setTimeout(() => m.style.display = 'none', 300);
}
document.getElementById('themeToggle').onclick = () => {
  const isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
};
document.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme') || 'light';
  root.setAttribute('data-theme', savedTheme);
  renderLang();
  addVisit();
  let cnt = localStorage.getItem('visit')||0;
  visitEl.textContent = `${i18n[currentLang].visit}：${cnt}`;

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.dataset.lang === currentLang) btn.classList.add('active');
    btn.onclick = () => {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLang = btn.dataset.lang;
      localStorage.setItem('lang', currentLang);
      renderLang();
      visitEl.textContent = `${i18n[currentLang].visit}：${localStorage.getItem('visit')||0}`;
    };
  });
  const footerBtns = document.querySelectorAll('.footer-bar .footer-btn');
  footerBtns[0].onclick = () => openModal(document.getElementById('agreementModal'));
  footerBtns[1].onclick = () => openModal(document.getElementById('userModal'));
  footerBtns[2].onclick = () => openModal(document.getElementById('privacyModal'));
  document.querySelectorAll('.modal-close').forEach(btn => {
    btn.onclick = () => {
      closeModal(agreementModal);
      closeModal(userModal);
      closeModal(privacyModal);
    };
  });
  [agreementModal, userModal, privacyModal].forEach(m => {
    m.onclick = e => e.target === m && closeModal(m);
  });
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.onclick = e => {
      e.preventDefault();
      const url = btn.dataset.url;
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => {
        const msg = currentLang === 'zh' ? '复制成功' : currentLang === 'en' ? 'Copied' : 'Скопировано';
        showToast(msg);
      });
    };
  });
  window.onscroll = () => {
    toTop.classList.toggle('show', window.scrollY > 200);
  };
  toTop.onclick = () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
});



// Material 3 ripple positioning
(function(){
 document.querySelectorAll('.btn,.block-content,#toTop').forEach(el=>{
  el.addEventListener('pointerdown',e=>{
   const r=el.getBoundingClientRect();
   el.style.setProperty('--x',(e.clientX-r.left)+'px');
   el.style.setProperty('--y',(e.clientY-r.top)+'px');
  });
 });
})();
</script>

  <style>
:root {
  --black: #000000;
  --pale-turquoise: #b6fff5;
  --bg-color: var(--black);
  --text-color: var(--pale-turquoise);
  --border-color: var(--pale-turquoise);
  --hover-bg: var(--pale-turquoise);
  --hover-text: var(--black);
  --muted-opacity: 0.3;
}
.light-mode {
  --bg-color: #f0f9f8;
  --text-color: #005f5f;
  --border-color: #008888;
  --hover-bg: #008888;
  --hover-text: #ffffff;
  --muted-opacity: 0.4;
}
* {
  box-sizing: border-box;
  -webkit-text-size-adjust: none;
  -webkit-tap-highlight-color: transparent;
}
.cube-top-svg {
  vertical-align: bottom;
  stroke-width: 2px;
}
a {
  color: inherit;
  text-decoration: none;
}
html {
  height: 100%;
  scroll-behavior: smooth;
}
body {
  margin: 0;
  min-height: 100%;
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: "Microsoft YaHei", "微软雅黑", Consolas, monospace;
  font-size: 1rem;
  line-height: 1.6;
  transition: background-color 0.3s ease, color 0.3s ease;
}
h1, h2, h3, h4, h5, h6 {
  margin-bottom: 10px;
  font-weight: bold;
}
h4 {
  margin-top: 10px;
  margin-bottom: 10px;
  font-size: 1rem;
  font-weight: 700;
  line-height: 24px;
}
.main-wrapper {
  width: 100%;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding-top: 38.2vh;
  padding-bottom: 38.2vh;
  display: flex;
}
.cube-wrapper {
  width: 88vw;
  max-width: 71.875rem;
  flex-direction: column;
  display: flex;
}
.floating-block {
  border: 2px solid var(--border-color);
  position: relative;
  transition: transform 0.5s ease-out;
}
.floating-block.down {
  transform: translate3d(0px, 0%, 0px);
  transition: transform 0.5s ease-in-out;
}
.floating-block.up {
  transform: translate3d(0px, -100%, 0px);
  transition: transform 0.3s ease-in-out;
}
.static-cube {
  width: 100%;
  max-width: 100%;
  margin-left: auto;
  margin-right: auto;
  position: relative;
}
.block-content {
  z-index: 0;
  justify-content: space-between;
  align-items: center;
  padding-top: 1rem;
  padding-bottom: 1rem;
  text-decoration: none;
  transition: color .2s, box-shadow .2s, background-color .2s, transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  display: flex;
  position: relative;
}
.block-content:hover {
  z-index: 1;
  background-color: var(--hover-bg);
  box-shadow: 0 0 10rem .1px var(--hover-bg);
  color: var(--hover-text);
  transform: translateY(-3px);
}
.block-title-wrapper {
  flex: 1;
  justify-content: flex-start;
  padding-left: 1.125rem;
  padding-right: 1.125rem;
  display: flex;
  align-items: center;
  gap: 10px;
}
.block-title {
  text-transform: capitalize;
  margin-top: 0;
  margin-bottom: 0;
  font-size: 1.125rem;
  font-weight: 400;
}
.block-title.muted {
  opacity: var(--muted-opacity);
}
.block-actions-wrapper {
  justify-content: flex-end;
  padding-right: 1.125rem;
  display: flex;
  gap: 10px;
  align-items: center;
}
.icon {
  width: 1.5rem;
  height: 1.5rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.os-icon {
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon.muted {
  opacity: var(--muted-opacity);
}
.cube-top {
  z-index: 0;
  width: 100%;
  position: absolute;
  top: 7px;
  left: -2px;
  transform: translate(0, -100%);
}
.cube-top-svg {
  width: 88vw;
  max-width: 71.875rem;
  color: var(--border-color);
}
.static-block {
  z-index: 0;
  border: 2px solid var(--border-color);
  background-color: var(--bg-color);
  margin-top: -2px;
  position: relative;
  transition: background-color 0.3s ease, border-color 0.3s ease;
}
.block-year {
  width: 4.875rem;
  padding-right: 1.125rem;
}
.block-client {
  width: 13.6875rem;
  padding-right: 1.125rem;
}
.block-studio {
  width: 12rem;
  padding-right: 1.125rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.block-type {
  width: 16rem;
}
.os-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  background: var(--hover-bg);
  color: var(--hover-text);
}
#float-trigger {
  width: 75%;
  height: 75%;
  position: absolute;
}
@media screen and (max-width: 991px) {
  .main-wrapper {
    padding-top: 22.2vh;
    padding-bottom: 22.2vh;
  }
  .block-title {
    font-size: 1rem;
  }
  .block-year {
    width: 4.375rem;
  }
  .block-client {
    width: 11.25rem;
  }
  .block-studio {
    display: none;
  }
}
@media screen and (max-width: 479px) {
  .block-title-wrapper {
    padding-left: .875rem;
    padding-right: .875rem;
  }
  .block-year {
    padding-right: .875rem;
  }
  .block-client {
    width: 8rem;
  }
  .block-type {
    display: none;
  }
  .os-tag {
    display: none;
  }
}
.lang-bar {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  gap: 6px;
}
.lang-btn, .footer-btn, .header-icon-btn {
  background: var(--bg-color);
  color: var(--text-color);
  border: 2px solid var(--border-color);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.lang-btn:hover, .footer-btn:hover, .header-icon-btn:hover {
  background-color: var(--hover-bg);
  color: var(--hover-text);
  box-shadow: 0 0 10rem 0.1px var(--hover-bg);
  transform: scale(1.05);
}
.lang-btn.active {
  background-color: var(--hover-bg);
  color: var(--hover-text);
}
.footer-bar {
  position: fixed;
  bottom: 10px;
  left: 10px;
  display: flex;
  gap: 6px;
  z-index: 999;
}
.header-icons {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 9999;
  display: flex;
  gap: 8px;
}
.dynamic-text {
  text-align: center;
  padding: 15px 0;
  font-size: 14px;
  color: var(--text-color);
  opacity: 0.8;
  min-height: 20px;
  transition: opacity 0.4s ease;
}
.visit-counter {
  position: fixed;
  bottom: 10px;
  right: 10px;
  color: var(--text-color);
  opacity: 0.7;
  font-size: 12px;
  z-index: 999;
}
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 99999;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.modal-overlay.show {
  opacity: 1;
}
.modal-box {
  background: rgba(20, 20, 20, 0.85);
  color: #fff;
  width: 90%;
  max-width: 680px;
  padding: 25px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  position: relative;
  max-height: 80vh;
  overflow-y: auto;
  transform: translateY(20px);
  transition: transform 0.3s ease;
}
.modal-overlay.show .modal-box {
  transform: translateY(0);
}
.modal-close {
  position: absolute;
  top: 12px; right: 12px;
  color: #fff;
  cursor: pointer;
  font-size: 18px;
  user-select: none;
}
.modal-title {
  font-size: 16px;
  margin-bottom: 15px;
  text-align: center;
}
.modal-text, .agreement-text {
  font-size: 13px;
  color: #eee;
  line-height: 1.7;
  text-align: left;
  white-space: pre-line;
}
.toast {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 16px;
  background: var(--hover-bg);
  color: var(--hover-text);
  border-radius: 6px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 99999;
}
.toast.show {
  opacity: 1;
}
#toTop {
  position: fixed;
  bottom: 60px;
  right: 15px;
  width: 36px;
  height: 36px;
  background: var(--bg-color);
  color: var(--text-color);
  border: 2px solid var(--border-color);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 999;
}
#toTop.show {
  opacity: 1;
}
#toTop:hover {
  background: var(--hover-bg);
  color: var(--hover-text);
  transform: scale(1.1);
}
.pulse-glow {
  animation: pulseGlow 3s infinite ease-in-out;
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 5px var(--border-color); }
  50% { box-shadow: 0 0 15px var(--border-color); }
}
</style>
</head>

    texts: [
      "免费工具 永久无广告","安全无毒 放心使用","持续更新 稳定兼容",
      "模组让游戏更丰富","热爱可抵岁月漫长","社区因你而温暖","用心创作 用爱发电"
    ]
  },
  en: {
    title: "TLDWorkshop", site_title: "TLDWorkshop",
    release_version: "Ver", os: "OS", version: "Ver", download: "Download",
    windows: "Windows", linux_no: "Linux", mod_loader: "Loader",
    qq_group: "QQ", bilibili: "Bilibili",
    visit: "Visits", agreement: "Legal", user: "Terms", privacy: "Privacy",
    agreement_content: `Free for study only. All copyrights belong to official. Use at your own risk.`,
    userContent: `For personal use only. No illegal use. We are not responsible for issues.`,
    privacyContent: `No personal data collected. Local storage only. No tracking.`,
    texts: [ "Free, No Ads", "Safe", "Stable", "Mods", "Love", "Community", "Create" ]
  },
  ru: {
    title: "TLDWorkshop", site_title: "TLDWorkshop",
    release_version: "Вер", os: "ОС", version: "Вер", download: "Скачать",
    windows: "Windows", linux_no: "Linux", mod_loader: "Загрузчик",
    qq_group: "QQ", bilibili: "Bilibili",
    visit: "Посещ", agreement: "Прав", user: "Усл", privacy: "Конф",
    agreement_content: `Бесплатно. Все права официальные. Используйте на свой страх.`,
    userContent: `Только для личного использования. Мы не несём ответственность.`,
    privacyContent: `Данные не собираем. Хранение локальное.`,
    texts: [ "Бесплатно", "Безопасно", "Стабильно", "Моды", "Любовь", "Сообщество", "Творч" ]
  }
};

let currentLang = localStorage.getItem('lang') || 'zh';
const textBox = document.getElementById('textBox');
const visitEl = document.getElementById('visit');
const themeToggle = document.getElementById('themeToggle');
const toast = document.getElementById('toast');
const toTop = document.getElementById('toTop');

const agreementModal = document.getElementById('agreementModal');
const userModal = document.getElementById('userModal');
const privacyModal = document.getElementById('privacyModal');
const agreementContent = document.getElementById('agreementContent');
const userContent = document.getElementById('userContent');
const privacyContent = document.getElementById('privacyContent');

let isLightMode = localStorage.getItem('theme') === 'light';
let textIndex = 0, textTimer;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1200);
}

themeToggle.addEventListener('click', () => {
  isLightMode = !isLightMode;
  document.body.classList.toggle('light-mode', isLightMode);
  localStorage.setItem('theme', isLightMode ? 'light' : 'dark');
  themeToggle.innerHTML = isLightMode 
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
});

function updateText() {
  const arr = i18n[currentLang].texts;
  textBox.style.opacity = "0";
  setTimeout(() => {
    textBox.textContent = arr[textIndex % arr.length];
    textBox.style.opacity = "0.8";
    textIndex++;
  }, 200);
}

function restartText() {
  clearInterval(textTimer);
  textIndex = 0;
  updateText();
  textTimer = setInterval(updateText, 3500);
}

function addVisit() {
  let cnt = localStorage.getItem('visit') || 0;
  cnt++;
  localStorage.setItem('visit', cnt);
  visitEl.textContent = `${i18n[currentLang].visit}：${cnt}`;
}

function renderLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.style.opacity = '0';
    setTimeout(() => {
      const k = el.dataset.i18n;
      if (i18n[currentLang][k]) el.textContent = i18n[currentLang][k];
      el.style.opacity = '1';
    }, 150);
  });
  document.title = i18n[currentLang].title;
  restartText();
  agreementContent.textContent = i18n[currentLang].agreement_content;
  userContent.textContent = i18n[currentLang].userContent;
  privacyContent.textContent = i18n[currentLang].privacyContent;
}

function openModal(modalEl) {
  modalEl.style.display = 'flex';
  setTimeout(() => modalEl.classList.add('show'), 10);
}
function closeModal(modalEl) {
  modalEl.classList.remove('show');
  setTimeout(() => modalEl.style.display = 'none', 300);
}

document.addEventListener('DOMContentLoaded', () => {
  document.body.classList.toggle('light-mode', isLightMode);
  if (isLightMode) {
    themeToggle.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
  }

  renderLang();
  addVisit();

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.dataset.lang === currentLang) btn.classList.add('active');
    btn.addEventListener('click', () => {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLang = btn.dataset.lang;
      localStorage.setItem('lang', currentLang);
      renderLang();
      visitEl.textContent = `${i18n[currentLang].visit}：${localStorage.getItem('visit')||0}`;
    });
  });

  document.querySelectorAll('.footer-bar .footer-btn')[0].onclick = () => openModal(agreementModal);
  document.querySelectorAll('.footer-bar .footer-btn')[1].onclick = () => openModal(userModal);
  document.querySelectorAll('.footer-bar .footer-btn')[2].onclick = () => openModal(privacyModal);

  document.querySelectorAll('.modal-close').forEach(btn => {
    btn.onclick = () => {
      closeModal(agreementModal);
      closeModal(userModal);
      closeModal(privacyModal);
    };
  });

  [agreementModal, userModal, privacyModal].forEach(m => {
    m.onclick = (e) => e.target === m && closeModal(m);
  });

  const floatTrigger = document.getElementById('float-trigger');
  const floatingBlock = document.querySelector('.floating-block');
  floatTrigger.addEventListener('mouseenter', () => {
    floatingBlock.classList.add('up');
    floatingBlock.classList.remove('down');
  });
  floatTrigger.addEventListener('mouseleave', (e) => {
    const isInside = e.relatedTarget && e.relatedTarget.closest('.cube-wrapper');
    if (isInside) return;
    floatingBlock.classList.add('down');
    floatingBlock.classList.remove('up');
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const url = btn.dataset.url;
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => {
        const msg = currentLang === 'zh' ? '复制成功' : currentLang === 'en' ? 'Copied' : 'Скопировано';
        showToast(msg);
      });
    });
  });

  window.addEventListener('scroll', () => {
    toTop.classList.toggle('show', window.scrollY > 200);
  });
  toTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
